<!DOCTYPE html><html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gene Factory V2 - インスリン工場をつくれ！</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0e1a;--bg2:#111827;--cyan:#00e5ff;--green:#76ff03;--magenta:#e040fb;--red:#ff1744;--gold:#ffd600;--blue:#448aff;--text:#e0e0e0;--text2:#9e9e9e;--glass:rgba(17,24,39,.85)}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none}
h1,h2,h3,.label{font-family:'Orbitron','Noto Sans JP',sans-serif}
.screen{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:20px;animation:fadeIn .6s;will-change:opacity,transform}
.screen.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{text-shadow:0 0 10px var(--cyan),0 0 40px rgba(0,229,255,.3)}50%{text-shadow:0 0 20px var(--cyan),0 0 60px rgba(0,229,255,.5)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.btn{font-family:'Orbitron',sans-serif;padding:14px 36px;border:2px solid var(--cyan);background:transparent;color:var(--cyan);font-size:1rem;cursor:pointer;border-radius:10px;transition:all .2s;letter-spacing:2px;min-height:52px;touch-action:none}
.btn:active{transform:scale(.95);background:rgba(0,229,255,.2)}
.btn.primary{background:linear-gradient(135deg,rgba(0,229,255,.2),rgba(118,255,3,.2));border-color:var(--green);color:var(--green)}
.btn.danger{border-color:var(--red);color:var(--red)}
.card{background:var(--glass);border:1px solid rgba(0,229,255,.2);border-radius:16px;padding:24px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transform:translateZ(0)}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:700;letter-spacing:1px}
.badge.cyan{background:rgba(0,229,255,.15);color:var(--cyan);border:1px solid rgba(0,229,255,.3)}
.badge.green{background:rgba(118,255,3,.15);color:var(--green);border:1px solid rgba(118,255,3,.3)}
.badge.red{background:rgba(255,23,68,.15);color:var(--red);border:1px solid rgba(255,23,68,.3)}
.badge.gold{background:rgba(255,214,0,.15);color:var(--gold);border:1px solid rgba(255,214,0,.3)}
.badge.blue{background:rgba(68,138,255,.15);color:var(--blue);border:1px solid rgba(68,138,255,.3)}
.badge.magenta{background:rgba(224,64,251,.15);color:var(--magenta);border:1px solid rgba(224,64,251,.3)}
.progress-bar{width:100%;height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
.progress-bar .fill{height:100%;border-radius:4px;transition:width .5s ease;background:linear-gradient(90deg,var(--cyan),var(--green))}
.score-bar{display:inline-block;padding:6px 16px;border-radius:20px;font-family:'Orbitron',sans-serif;font-size:.9rem;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.3);color:var(--cyan)}
.content{position:relative;z-index:1;width:100%;max-width:900px;margin:0 auto}
.logo{font-size:clamp(2rem,5vw,3.5rem);font-weight:900;background:linear-gradient(135deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:glow 3s infinite;margin-bottom:8px}
.tutorial-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn .4s;padding:20px}
.tutorial-box{max-width:650px;padding:28px;border-radius:20px;background:var(--bg2);border:1px solid rgba(0,229,255,.3);text-align:center;max-height:90vh;overflow-y:auto}
.tutorial-box h2{color:var(--cyan);margin-bottom:16px;font-size:1.2rem}
.opt-card{background:var(--glass);border:2px solid rgba(255,255,255,.1);border-radius:12px;padding:16px;text-align:left;cursor:pointer;transition:all .3s;margin:8px 0;touch-action:none;transform:translateZ(0)}
.opt-card:active{transform:scale(.97)}
.opt-card.selected{border-color:var(--gold);box-shadow:0 0 20px rgba(255,214,0,.3)}
.opt-card.correct{border-color:var(--green);box-shadow:0 0 20px rgba(118,255,3,.4)}
.opt-card.wrong{border-color:var(--red);box-shadow:0 0 20px rgba(255,23,68,.4)}
.opt-card b{display:block;font-size:.95rem;margin-bottom:4px}
.opt-card span{font-size:.8rem;color:var(--text2);line-height:1.5}
.opt-card code{background:rgba(0,229,255,.1);padding:2px 6px;border-radius:4px;font-size:.8rem;font-family:monospace}
.dna-seq{font-family:monospace;font-size:1rem;letter-spacing:1px;padding:12px;background:rgba(0,0,0,.3);border-radius:8px;text-align:center;line-height:2;overflow-x:auto;word-break:break-all}
.dna-seq .cut{color:var(--red);font-weight:700}.dna-seq .ins{color:var(--green);font-weight:700}.dna-seq .sticky{color:var(--gold);font-weight:700}.dna-seq .normal{color:var(--text2)}
.timer-bar{font-family:'Orbitron',sans-serif;font-size:1.5rem;font-weight:900;text-align:center;margin:8px 0}
.plate{width:180px;height:180px;border-radius:50%;border:8px solid rgba(132,184,194,.45);background:radial-gradient(circle at 38% 28%,rgba(255,255,255,.3),transparent 40%),#f6dfac;position:relative;box-shadow:inset 0 0 20px rgba(88,58,22,.13);transform:translateZ(0)}
.colony{position:absolute;border-radius:50%;border:2px solid rgba(31,45,68,.12);box-shadow:0 3px 7px rgba(31,45,68,.12);cursor:pointer;transition:all .3s;will-change:width,height,transform;transform:translateZ(0)}
.colony.white{background:#fffef5}.colony.blue{background:#3b9df2}
.colony.selected{box-shadow:0 0 0 5px rgba(255,214,0,.4);transform:scale(1.15) translateZ(0)}
.review-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0;width:100%}
.review-item{text-align:center;padding:16px;border-radius:12px;background:var(--glass);border:1px solid rgba(255,255,255,.1)}
.review-item .rv-label{font-size:.7rem;color:var(--text2);margin-bottom:4px}
.review-item .rv-val{font-family:'Orbitron',sans-serif;font-size:1.3rem;font-weight:700}
.info-popup{background:var(--glass);border:1px solid rgba(0,229,255,.3);border-radius:12px;padding:16px;font-size:.85rem;line-height:1.7;margin-top:8px}
.info-popup .title{color:var(--cyan);font-weight:700;margin-bottom:4px}
.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:200;overflow:hidden}
.confetti-piece{position:absolute;width:10px;height:18px;top:-20px;animation:confetti-fall 2.5s linear forwards;will-change:transform}
@keyframes confetti-fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
#particles-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;will-change:transform}
.plate-wrap{display:inline-block;text-align:center;margin:8px}
.plate-label{font-size:.75rem;color:var(--text2);margin-top:6px}
@media(max-width:768px){.review-grid{grid-template-columns:1fr 1fr}}
</style></head><body>
<canvas id="particles-bg"></canvas>
<div id="title" class="screen active">
<div class="content" style="text-align:center">
<div style="margin-bottom:20px;font-size:4rem;animation:float 3s infinite">🧬</div>
<h1 class="logo">GENE FACTORY</h1>
<p style="color:var(--text2);margin-bottom:8px;letter-spacing:3px;font-size:clamp(.8rem,2vw,1rem)">V2 — インスリン工場をつくれ！</p>
<div class="card" style="text-align:left;max-width:650px;margin:0 auto 24px">
<p style="line-height:2;font-size:.95rem">あなたは<span style="color:var(--cyan);font-weight:700">バイオテック研究所の新人研究員</span>。</p>
<p style="line-height:2;font-size:.95rem;margin-top:8px">ミッション：<span style="color:var(--green);font-weight:700">ヒトのインスリン遺伝子</span>を大腸菌に導入し、<span style="color:var(--gold);font-weight:700">インスリン産生大腸菌</span>を完成させよ！</p>
<div style="display:flex;gap:10px;margin:16px 0;flex-wrap:wrap;justify-content:center">
<div style="text-align:center;padding:8px;border:1px solid rgba(0,229,255,.2);border-radius:10px;width:90px;background:rgba(0,229,255,.05)"><div style="font-size:1.3rem">✂️</div><div style="font-size:.7rem">DNA切断</div></div>
<div style="text-align:center;padding:8px;border:1px solid rgba(0,229,255,.2);border-radius:10px;width:90px;background:rgba(0,229,255,.05)"><div style="font-size:1.3rem">🔄</div><div style="font-size:.7rem">プラスミド</div></div>
<div style="text-align:center;padding:8px;border:1px solid rgba(0,229,255,.2);border-radius:10px;width:90px;background:rgba(0,229,255,.05)"><div style="font-size:1.3rem">🔗</div><div style="font-size:.7rem">ライゲーション</div></div>
<div style="text-align:center;padding:8px;border:1px solid rgba(0,229,255,.2);border-radius:10px;width:90px;background:rgba(0,229,255,.05)"><div style="font-size:1.3rem">🌡️</div><div style="font-size:.7rem">形質転換</div></div>
<div style="text-align:center;padding:8px;border:1px solid rgba(0,229,255,.2);border-radius:10px;width:90px;background:rgba(0,229,255,.05)"><div style="font-size:1.3rem">🔥</div><div style="font-size:.7rem">培養</div></div>
<div style="text-align:center;padding:8px;border:1px solid rgba(0,229,255,.2);border-radius:10px;width:90px;background:rgba(0,229,255,.05)"><div style="font-size:1.3rem">🧫</div><div style="font-size:.7rem">コロニー選択</div></div>
</div></div>
<button class="btn primary" id="btn-start">▶ 研究開始</button>
</div></div>
<div id="phase1" class="screen"><div class="content" id="p1c"></div></div>
<div id="phase2" class="screen"><div class="content" id="p2c"></div></div>
<div id="phase3" class="screen"><div class="content" id="p3c"></div></div>
<div id="phase4" class="screen"><div class="content" id="p4c"></div></div>
<div id="phase5" class="screen"><div class="content" id="p5c"></div></div>
<div id="phase6" class="screen"><div class="content" id="p6c"></div></div>
<div id="results" class="screen"><div class="content" id="resc" style="text-align:center"></div></div>
<div id="confetti-container" class="confetti-container"></div>
<script>
const G={score:0,phase:0,scores:[0,0,0,0,0,0]};
const PHASES=[{name:'DNA切断',badge:'cyan',icon:'✂️'},{name:'プラスミド選択',badge:'green',icon:'🔄'},{name:'ライゲーション',badge:'gold',icon:'🔗'},{name:'形質転換',badge:'red',icon:'🌡️'},{name:'培養',badge:'magenta',icon:'🔥'},{name:'コロニー選択',badge:'blue',icon:'🧫'}];
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function playSound(t){initAudio();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);
if(t==='success'){o.type='sine';o.frequency.setValueAtTime(523,audioCtx.currentTime);o.frequency.setValueAtTime(659,audioCtx.currentTime+.1);o.frequency.setValueAtTime(784,audioCtx.currentTime+.2);g.gain.setValueAtTime(.15,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.5);o.start();o.stop(audioCtx.currentTime+.5);}
else if(t==='fail'){o.type='sawtooth';o.frequency.setValueAtTime(200,audioCtx.currentTime);o.frequency.linearRampToValueAtTime(100,audioCtx.currentTime+.5);g.gain.setValueAtTime(.12,audioCtx.currentTime);g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+.5);o.start();o.stop(audioCtx.currentTime+.5);}
else if(t==='click'){o.type='sine';o.frequency.setValueAtTime(1000,audioCtx.currentTime);g.gain.setValueAtTime(.08,audioCtx.currentTime);g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+.06);o.start();o.stop(audioCtx.currentTime+.06);}
else if(t==='levelup'){o.type='sine';o.frequency.setValueAtTime(440,audioCtx.currentTime);o.frequency.setValueAtTime(554,audioCtx.currentTime+.12);o.frequency.setValueAtTime(659,audioCtx.currentTime+.24);o.frequency.setValueAtTime(880,audioCtx.currentTime+.36);g.gain.setValueAtTime(.15,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.7);o.start();o.stop(audioCtx.currentTime+.7);}
else{o.type='sine';o.frequency.setValueAtTime(523,audioCtx.currentTime);g.gain.setValueAtTime(.12,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.4);o.start();o.stop(audioCtx.currentTime+.4);}}

function addFastClick(id,cb){const el=typeof id==='string'?document.getElementById(id):id;if(!el)return;el.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();cb(e);});}

const pCV=document.getElementById('particles-bg'),pCx=pCV.getContext('2d');let pts=[];
function initP(){pCV.width=innerWidth;pCV.height=innerHeight;pts=[];for(let i=0;i<30;i++)pts.push({x:Math.random()*pCV.width,y:Math.random()*pCV.height,r:Math.random()*2+.5,dx:(Math.random()-.5)*.3,dy:(Math.random()-.5)*.3,a:Math.random()*.3+.1});}
function drawP(){pCx.clearRect(0,0,pCV.width,pCV.height);pts.forEach(p=>{pCx.beginPath();pCx.arc(p.x,p.y,p.r,0,Math.PI*2);pCx.fillStyle=`rgba(118,255,3,${p.a})`;pCx.fill();p.x+=p.dx;p.y+=p.dy;if(p.x<0||p.x>pCV.width)p.dx*=-1;if(p.y<0||p.y>pCV.height)p.dy*=-1;});requestAnimationFrame(drawP);}
addEventListener('resize',initP);initP();drawP();
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0);}
function showTut(title,steps,cbName){const ov=document.createElement('div');ov.className='tutorial-overlay';ov.id='tut';let h='<div class="tutorial-box"><h2>'+title+'</h2>';steps.forEach((s,i)=>{h+='<div style="display:flex;align-items:flex-start;gap:10px;margin:6px 0;padding:8px;border-radius:8px;background:rgba(0,229,255,.05)"><div style="font-family:Orbitron;color:var(--cyan);font-weight:700;min-width:20px">'+(i+1)+'</div><div style="font-size:.85rem;line-height:1.6;text-align:left">'+s+'</div></div>';});h+='<button class="btn primary" id="btn-tut-ok" style="margin-top:14px">OK！始めよう</button></div>';ov.innerHTML=h;document.body.appendChild(ov);addFastClick('btn-tut-ok',()=>{document.getElementById('tut').remove();window[cbName]();});}
function phaseHdr(idx){const p=PHASES[idx];return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px"><div><span class="badge '+p.badge+'">PHASE '+(idx+1)+'</span> <span style="margin-left:8px;font-weight:700">'+p.name+'</span></div><div class="score-bar">SCORE: <span id="ps">'+G.scores[idx]+'</span> | 合計: '+G.score+'</div></div><div class="progress-bar" style="margin-bottom:12px"><div class="fill" style="width:'+(idx/6*100)+'%"></div></div>';}
function launchConfetti(){const c=document.getElementById('confetti-container');const cols=['#ff1744','#00e5ff','#76ff03','#ffd600','#e040fb','#448aff'];for(let i=0;i<60;i++){const p=document.createElement('div');p.className='confetti-piece';p.style.left=Math.random()*100+'%';p.style.background=cols[i%cols.length];p.style.animationDuration=(1.5+Math.random()*1.5)+'s';p.style.animationDelay=(Math.random()*.3)+'s';c.appendChild(p);setTimeout(()=>p.remove(),3500);}}

// ===== PHASE 1: DNA CUTTING =====
let p1sel=new Set(),p1timer=60,p1interval=null;
const ENZYMES=[{id:'EcoRI',site:'GAATTC',end:'5\'-AATT-3\' 突出'},{id:'BamHI',site:'GGATCC',end:'5\'-GATC-3\' 突出'},{id:'HindIII',site:'AAGCTT',end:'5\'-AGCT-3\' 突出'},{id:'SmaI',site:'CCCGGG',end:'平滑末端'},{id:'PstI',site:'CTGCAG',end:'3\'-ACGT-5\' 突出'},{id:'NotI',site:'GCGGCCGC',end:'5\'-GGCC-3\' 突出'}];
addFastClick('btn-start',()=>startGame());
function startGame(){showScreen('phase1');showTut('✂️ Phase 1: DNA切断',['ヒトDNAからインスリン遺伝子を<strong>制限酵素</strong>で切り出します。','DNA配列中の<strong>認識配列</strong>を探し、正しい制限酵素を<strong>2種類</strong>選んでください。','<strong style="color:var(--red)">制限時間あり！</strong>速いほど高得点。よく見て素早く判断しよう。'],'renderP1');}
function renderP1(){
p1sel.clear();p1timer=60;
const el=document.getElementById('p1c');
let h=phaseHdr(0);
h+='<div class="timer-bar" id="p1timer" style="color:var(--cyan)">⏱ 60秒</div>';
h+='<div class="card" style="margin-bottom:12px"><h3 style="font-size:.85rem;color:var(--cyan);margin-bottom:8px">🧬 ヒトDNA — インスリン遺伝子領域</h3>';
h+='<div class="dna-seq"><span class="normal">...ATCGGTAC</span><span class="cut">GAATTC</span><span class="normal">TACCG</span><span class="ins">ATGTTCGTCAACCAACACTTGTGTGGCTCACACCTGGTGGAAGCTCTCTACCTAGTGTGCGGGGAACGAGGCTTCTTCTACACACCCAAGACCCGCCGGGAGGCAGAGGACCTGCAGGTGGGGCAGGTGGAGCTGGGCGGGGGCCCTGGTGCAGGCAGCCTGCAGCCCTTGGCCCTGGAGGGGTCCCTGCAGAAGCGTGGCATTGTGGAACAATGCTGTACCAGCATCTGCTCCCTCTACCAGCTGGAGAACTACTGCAACTGA</span><span class="normal">GCCTA</span><span class="cut">AAGCTT</span><span class="normal">GCATTGCGA...</span></div>';
h+='<p style="font-size:.75rem;color:var(--text2);margin-top:6px;text-align:center">緑: インスリン遺伝子配列 ｜ 赤: 制限酵素認識部位 ｜ 灰: ヒトDNA</p></div><h3 style="font-size:.85rem;color:var(--text2);margin:12px 0 6px">制限酵素を2つ選択せよ</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px" id="p1-opts"></div>';
h+='<div style="text-align:center;margin-top:12px"><button class="btn primary" id="btn-p1-check">✂️ DNAを切断！</button></div><div id="p1fb" class="info-popup"><div class="title">💡 ヒント</div>DNA配列中の隠れている<strong style="color:var(--red)">赤い認識配列</strong>を探して、それに対応する酵素を選びましょう。</div>';
el.innerHTML=h;
const opts=document.getElementById('p1-opts');
ENZYMES.forEach(e=>{const c=document.createElement('div');c.className='opt-card';c.innerHTML='<b>'+e.id+'</b><span>認識配列: <code>'+e.site+'</code><br>切断末端: '+e.end+'</span>';addFastClick(c,()=>p1toggle(e.id,c));opts.appendChild(c);});
addFastClick('btn-p1-check',()=>p1check());
if(p1interval)clearInterval(p1interval);
p1interval=setInterval(()=>{p1timer--;const te=document.getElementById('p1timer');if(te){te.textContent='⏱ '+p1timer+'秒';if(p1timer<=10)te.style.color='var(--red)';if(p1timer<=0){clearInterval(p1interval);p1check();}}},1000);}

function p1toggle(id,el){playSound('click');if(p1sel.has(id))p1sel.delete(id);else{if(p1sel.size>=2)return;p1sel.add(id);}
document.querySelectorAll('#p1-opts .opt-card').forEach(c=>{c.classList.toggle('selected',p1sel.has(c.querySelector('b').textContent));});}

function p1check(){
clearInterval(p1interval);const fb=document.getElementById('p1fb');
if(p1sel.size!==2){fb.innerHTML='<div class="title" style="color:var(--red)">⚠️</div>2種類の制限酵素を選んでください。';playSound('fail');p1interval=setInterval(()=>{p1timer--;const te=document.getElementById('p1timer');if(te){te.textContent='⏱ '+p1timer+'秒';if(p1timer<=0){clearInterval(p1interval);p1check();}}},1000);return;}
if(p1sel.has('EcoRI')&&p1sel.has('HindIII')){
playSound('success');const bonus=Math.max(0,p1timer)*2,pts=50+bonus;G.scores[0]=pts;G.score+=pts;
fb.innerHTML='<div class="title" style="color:var(--green)">🎉 正解！ +'+(pts)+'点（タイムボーナス: +'+bonus+'）</div>EcoRI（GAATTC）で左端を、HindIII（AAGCTT）で右端を切断。異なる付着端により<strong>方向性のある挿入</strong>が可能に！<br><div class="dna-seq" style="margin-top:8px"><span class="sticky">AATT</span><span class="ins">C—インスリン遺伝子—A</span><span class="sticky">AGCT</span></div>';
setTimeout(()=>{playSound('levelup');showScreen('phase2');renderP2();showTut('🔄 Phase 2: プラスミド選択',['インスリン遺伝子を大腸菌に運ぶ<strong>ベクター（プラスミド）</strong>を選びます。','4つの候補プラスミドのマップを見て、最適なものを選んでください。','<span style="color:var(--green)">ampR（アンピシリン耐性）</span>: アンピシリン入り培地でプラスミド保持菌を選択するためのマーカー','<span style="color:var(--magenta)">lacZ（β-ガラクトシダーゼ）</span>: 遺伝子が挿入されるとlacZが壊れ、<strong>白コロニー</strong>として見分けられる（青白選択）','プラスミドマップの<strong>制限酵素サイトの位置</strong>がカギ！'],'renderP2');},2000);
}else{playSound('fail');G.score=Math.max(0,G.score-5);fb.innerHTML='<div class="title" style="color:var(--red)">✗ 不正解</div>DNA配列中の赤い認識配列（GAATTCとAAGCTT）に注目してください。';}}

// ===== PHASE 2: PLASMID SELECTION =====
let p2sel='';
const PLASMIDS=[
{id:'pGF-1',name:'pGF-1',correct:true,features:{ori:true,ampR:true,lacZ:true,ecoRI:'lacZ内',hindIII:'lacZ内'},desc:'EcoRI/HindIIIサイトがlacZ内（MCS）にある。挿入されればlacZが破壊され青白選択可能。',why:'✅ 全条件クリア。lacZ内挿入により白コロニーとして検出可能。'},
{id:'pGF-2',name:'pGF-2',correct:false,features:{ori:true,ampR:true,lacZ:true,ecoRI:'lacZ外（ori付近）',hindIII:'lacZ外（ori付近）'},desc:'EcoRI/HindIIIサイトがlacZ遺伝子の外にある。',why:'❌ 挿入されてもlacZは壊れないため、青白選択で区別不可。'},
{id:'pGF-3',name:'pGF-3',correct:false,features:{ori:true,ampR:true,lacZ:true,ecoRI:'ampR遺伝子内',hindIII:'ampR遺伝子内'},desc:'EcoRI/HindIIIサイトがampR遺伝子内にある。',why:'❌ 挿入されるとampRが壊れ、アンピシリン培地で生存できない。'},
{id:'pGF-4',name:'pGF-4',correct:false,features:{ori:true,ampR:false,lacZ:true,ecoRI:'lacZ内',hindIII:'なし'},desc:'HindIIIサイトがなく、ampR遺伝子も欠損。',why:'❌ 方向性挿入不可かつ選択マーカーなし。'}
];
function drawPlasmidSVG(p){
const r=90,cx=130,cy=130;let svg='<svg width="260" height="260" viewBox="0 0 260 260" style="display:block;margin:0 auto"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="22"/><path d="M'+cx+' '+(cy-r)+' A'+r+' '+r+' 0 0 1 '+(cx+r*.7)+' '+(cy-r*.7)+'" fill="none" stroke="rgba(0,229,255,.5)" stroke-width="22"/><text x="'+(cx+15)+'" y="'+(cy-r-8)+'" fill="var(--cyan)" font-size="10" font-weight="700">ori</text>';
if(p.features.ampR){svg+='<path d="M'+(cx+r*.7)+' '+(cy-r*.7)+' A'+r+' '+r+' 0 0 1 '+(cx+r)+' '+cy+'" fill="none" stroke="var(--green)" stroke-width="22"/><text x="'+(cx+r+5)+'" y="'+(cy-15)+'" fill="var(--green)" font-size="10" font-weight="700">ampR</text>';}
else{svg+='<path d="M'+(cx+r*.7)+' '+(cy-r*.7)+' A'+r+' '+r+' 0 0 1 '+(cx+r)+' '+cy+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="22" stroke-dasharray="4"/><text x="'+(cx+r+5)+'" y="'+(cy-15)+'" fill="var(--red)" font-size="9" font-weight="700">ampR欠損</text>';}
svg+='<path d="M'+(cx+r)+' '+cy+' A'+r+' '+r+' 0 0 1 '+(cx-r*.7)+' '+(cy+r*.7)+'" fill="none" stroke="var(--magenta)" stroke-width="22"/><text x="'+(cx-5)+'" y="'+(cy+r+16)+'" fill="var(--magenta)" font-size="10" font-weight="700">lacZ</text><path d="M'+(cx-r*.7)+' '+(cy+r*.7)+' A'+r+' '+r+' 0 0 1 '+cx+' '+(cy-r)+'" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="22"/>';
function siteMarker(label,angle,color){const x=cx+(r+32)*Math.cos(angle),y=cy+(r+32)*Math.sin(angle),mx=cx+r*Math.cos(angle),my=cy+r*Math.sin(angle);svg+='<circle cx="'+mx+'" cy="'+my+'" r="5" fill="'+color+'" stroke="#fff" stroke-width="1.5"/><text x="'+x+'" y="'+(y+4)+'" fill="'+color+'" font-size="8" font-weight="700" text-anchor="middle">'+label+'</text>';}
const loc=p.features;if(loc.ecoRI==='lacZ内')siteMarker('EcoRI',Math.PI*.6,'var(--gold)');else if(loc.ecoRI==='lacZ外（ori付近）')siteMarker('EcoRI',-Math.PI*.35,'var(--gold)');else if(loc.ecoRI==='ampR遺伝子内')siteMarker('EcoRI',-Math.PI*.15,'var(--gold)');
if(loc.hindIII==='lacZ内')siteMarker('HindIII',Math.PI*.8,'var(--gold)');else if(loc.hindIII==='lacZ外（ori付近）')siteMarker('HindIII',-Math.PI*.5,'var(--gold)');else if(loc.hindIII==='ampR遺伝子内')siteMarker('HindIII',-Math.PI*.05,'var(--gold)');
return svg+'</svg>';}
function renderP2(){
const el=document.getElementById('p2c');let h=phaseHdr(1);
h+='<div class="card" style="margin-bottom:12px;text-align:center" id="p2-map"></div><div id="p2-opts"></div><div style="text-align:center;margin-top:12px"><button class="btn primary" id="btn-p2-check">🔄 このプラスミドを採用</button></div><div id="p2fb" class="info-popup"><div class="title">💡 ヒント</div>挿入位置がlacZ内なら青白選択可能。ampR内だと耐性が失われる点に注意。</div>';
el.innerHTML=h;const m=document.getElementById('p2-map'),o=document.getElementById('p2-opts');
const selP=PLASMIDS.find(p=>p.id===p2sel)||PLASMIDS[0];m.innerHTML='<h3 style="font-size:.85rem;color:var(--cyan);margin-bottom:8px">プラスミドマップ</h3>'+drawPlasmidSVG(selP)+'<p style="font-size:.75rem;color:var(--text2);margin-top:4px">'+selP.name+'のマップ</p>';
PLASMIDS.forEach(p=>{const c=document.createElement('div');c.className='opt-card'+(p2sel===p.id?' selected':'');c.innerHTML='<b>'+p.name+'</b><span>'+p.desc+'</span>';addFastClick(c,()=>p2pick(p.id));o.appendChild(c);});
addFastClick('btn-p2-check',()=>p2check());}
function p2pick(id){playSound('click');p2sel=id;renderP2();}
function p2check(){
const fb=document.getElementById('p2fb');if(!p2sel){fb.innerHTML='プラスミドを選んでください。';return;}
const sel=PLASMIDS.find(p=>p.id===p2sel);
if(sel.correct){playSound('success');G.scores[1]=50;G.score+=50;fb.innerHTML='<div class="title" style="color:var(--green)">🎉 正解！</div>'+sel.why;setTimeout(()=>{playSound('levelup');showScreen('phase3');renderP3();showTut('🔗 Phase 3: ライゲーション',['遺伝子とプラスミドをDNAリガーゼで連結します。','反応後に生じる産物を全て選びましょう。'],'renderP3');},2000);
}else{playSound('fail');fb.innerHTML='<div class="title" style="color:var(--red)">✗ 不正解</div>'+sel.why;}}

// ===== PHASE 3: LIGATION =====
let ligSel=new Set();
function renderP3(){
const el=document.getElementById('p3c');let h=phaseHdr(2);
h+='<div class="card" style="margin-bottom:12px"><h3 style="font-size:.85rem;color:var(--cyan);margin-bottom:8px">🔗 ライゲーション反応</h3><div class="dna-seq" style="font-size:.85rem">pGF-1（開環） + インスリン断片 ↓ DNAリガーゼ ↓</div></div><h3 style="font-size:.85rem;color:var(--text2);margin:8px 0 6px">生じる産物は？（全て選択）</h3><div id="p3-opts"></div><div style="text-align:center;margin-top:12px"><button class="btn primary" id="btn-p3-check">🔗 回答確定</button></div><div id="p3fb" class="info-popup"><div class="title">💡 ヒント</div>反応は完全ではないため、様々な産物が混在します。</div>';
el.innerHTML=h;const o=document.getElementById('p3-opts'),opts=[{id:'recomb',label:'✅ 組換えプラスミド',ok:true},{id:'self',label:'🔄 自己閉環プラスミド',ok:true},{id:'linear',label:'📏 未反応の直鎖DNA',ok:true},{id:'double',label:'⚠️ 2コピー入り',ok:false}];
opts.forEach(opt=>{const c=document.createElement('div');c.className='opt-card';c.innerHTML='<b>'+opt.label+'</b>';addFastClick(c,()=>ligTog(opt.id,c));o.appendChild(c);});
addFastClick('btn-p3-check',()=>p3check());}
function ligTog(id,el){playSound('click');if(ligSel.has(id))ligSel.delete(id);else ligSel.add(id);el.classList.toggle('selected',ligSel.has(id));}
function p3check(){
const ok=ligSel.has('recomb')&&ligSel.has('self')&&ligSel.has('linear')&&!ligSel.has('double');
if(ok){playSound('success');G.scores[2]=50;G.score+=50;setTimeout(()=>{playSound('levelup');showScreen('phase4');renderP4();showTut('🌡️ Phase 4: 形質転換',['温度変化で大腸菌にプラスミドを導入します。','目標温度でSTOPを押してください。'],'renderP4');},2000);
}else{playSound('fail');document.getElementById('p3fb').innerHTML='<div class="title" style="color:var(--red)">✗ 不正解</div>全ての可能性を考えてください。';}}

// ===== PHASE 4: HEAT SHOCK =====
let hsStep=0,hsTN=0,hsDir=1,hsSp=0.012;
function renderP4(){
const el=document.getElementById('p4c');let h=phaseHdr(3);
h+='<div class="card" style="text-align:center"><canvas id="hsg" width="200" height="200" style="display:block;margin:0 auto"></canvas><div style="font-family:Orbitron;font-size:2rem;font-weight:900" id="hst">0℃</div><div style="font-size:.8rem;color:var(--text2)" id="hsm"></div><button class="btn" id="hsbtn" style="margin-top:10px">🎯 STOP!!</button></div><div id="p4fb" class="info-popup"></div>';
el.innerHTML=h;hsStep=0;hsTN=0;hsDir=1;addFastClick('hsbtn',()=>hsStop());requestAnimationFrame(hsAnim);}
function hsAnim(){
if(!document.getElementById('phase4').classList.contains('active'))return;
const cv=document.getElementById('hsg');if(!cv)return;const ctx=cv.getContext('2d'),cx=100,cy=100,r=80;ctx.clearRect(0,0,200,200);
const sA=Math.PI*.75,eA=Math.PI*2.25,rng=eA-sA,tgt=[[0,5],[40,44],[0,5]][hsStep]||[0,5];
ctx.beginPath();ctx.arc(cx,cy,r,sA,eA);ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=12;ctx.stroke();
ctx.beginPath();ctx.arc(cx,cy,r,sA+rng*(tgt[0]/50),sA+rng*(tgt[1]/50));ctx.strokeStyle='rgba(0,229,255,.4)';ctx.lineWidth=16;ctx.stroke();
const a=sA+rng*hsTN;ctx.beginPath();ctx.arc(cx,cy,r,sA,a);ctx.strokeStyle=hsTN>.7?'var(--red)':'var(--cyan)';ctx.lineWidth=12;ctx.stroke();
const tmp=Math.round(50*hsTN);document.getElementById('hst').textContent=tmp+'℃';
document.getElementById('hsm').textContent=['① 氷上(0℃)','② 42℃ショック','③ 氷上(0℃)'][hsStep];
hsTN+=hsDir*hsSp;if(hsTN>1||hsTN<0)hsDir*=-1;requestAnimationFrame(hsAnim);}
function hsStop(){
const tmp=Math.round(50*hsTN),tgt=[[0,5],[40,44],[0,5]][hsStep];
if(tmp>=tgt[0]&&tmp<=tgt[1]){playSound('success');hsStep++;if(hsStep>=3){G.scores[3]=60;G.score+=60;setTimeout(()=>{showScreen('phase5');renderP5();showTut('🔥 Phase 5: 培養',['37℃付近を維持してコロニーを育てましょう。','ヒーターのON/OFFで温度を調整してください。'],'renderP5');},2000);}
}else{playSound('fail');}}

// ===== PHASE 5: INCUBATION (Optimized) =====
let incTemp=37,incHeater=true,incTime=0,incMaxTime=300,incScore=0,incAF=null,colonies5=[];
function renderP5(){
const el=document.getElementById('p5c');let h=phaseHdr(4);
h+='<div class="card" style="text-align:center"><div style="font-family:Orbitron;font-size:2.5rem;font-weight:900" id="incT">37.0℃</div><div class="progress-bar" style="height:20px;margin:8px 0"><div id="incBar" class="fill" style="width:0%"></div></div><div id="incPlate" class="plate" style="width:200px;height:200px;margin:12px auto;transform:translateZ(0)"></div><button class="btn" id="incBtn">🔥 ヒーター: ON</button></div><div id="p5fb" class="info-popup"></div>';
el.innerHTML=h;incTemp=37;incHeater=true;incTime=0;incScore=0;colonies5=[];
addFastClick('incBtn',()=>toggleHeater());
cancelAnimationFrame(incAF);incAF=requestAnimationFrame(incLoop);}
function toggleHeater(){playSound('click');incHeater=!incHeater;document.getElementById('incBtn').textContent='🔥 ヒーター: '+(incHeater?'ON':'OFF');}
function incLoop(){
if(!document.getElementById('phase5').classList.contains('active'))return;
incTime++;incTemp+=(Math.random()-.5)*0.8+(incHeater?0.3:-0.4);incTemp=Math.max(20,Math.min(50,incTemp));
if(Math.abs(incTemp-37)<2)incScore+=2;
const te=document.getElementById('incT'),bar=document.getElementById('incBar'),plate=document.getElementById('incPlate');
if(te){te.textContent=incTemp.toFixed(1)+'℃';te.style.color=Math.abs(incTemp-37)<3?'var(--green)':'var(--red)';}
if(bar)bar.style.width=(incTime/incMaxTime*100)+'%';
if(incTime%20===0&&Math.abs(incTemp-37)<5&&colonies5.length<15){
    const c={x:20+Math.random()*60,y:20+Math.random()*60,r:2,blue:Math.random()>0.35,el:document.createElement('div')};
    c.el.className='colony '+(c.blue?'blue':'white');c.el.style.left=c.x+'%';c.el.style.top=c.y+'%';
    plate.appendChild(c.el);colonies5.push(c);
}
colonies5.forEach(c=>{const s=Math.min(c.r+(incTime/incMaxTime)*12,22);c.el.style.width=s+'px';c.el.style.height=s+'px';});
if(incTime>=incMaxTime){G.scores[4]=50;G.score+=50;playSound('success');document.getElementById('p5fb').innerHTML='<button class="btn primary" id="btn-p5-next">🧫 次へ</button>';addFastClick('btn-p5-next',()=>goP6());return;}
incAF=requestAnimationFrame(incLoop);}
function goP6(){playSound('levelup');showScreen('phase6');renderP6();showTut('🧫 Phase 6: コロニー選択',['正しい培地の正しい色のコロニーを選んでください。'],'renderP6');}

// ===== PHASE 6: COLONY SELECTION =====
let p6col='';
const PLATES_DATA=[
{id:'LB',name:'ⓐ LB培地',cols:[{x:22,y:25,c:'white'},{x:45,y:35,c:'white'}]},
{id:'LBamp',name:'ⓑ LB/amp培地',cols:[{x:30,y:30,c:'white'},{x:55,y:25,c:'white'}]},
{id:'LBampXI',name:'ⓓ LB/amp/X-gal/IPTG',cols:[{x:25,y:30,c:'blue'},{x:55,y:20,c:'white',target:true},{x:70,y:45,c:'blue'}]},
{id:'LBnoamp',name:'ⓒ LB/amp(対照)',cols:[]}
];
function renderP6(){
const el=document.getElementById('p6c');let h=phaseHdr(5);
h+='<div id="p6-plates" style="display:flex;flex-wrap:wrap;justify-content:center;gap:16px"></div><div style="text-align:center;margin-top:12px"><button class="btn primary" id="btn-p6-check">🔍 最終鑑定</button></div><div id="p6fb" class="info-popup"></div>';
el.innerHTML=h;const wrap=document.getElementById('p6-plates');
PLATES_DATA.forEach(pl=>{
    const pw=document.createElement('div');pw.className='plate-wrap';pw.innerHTML='<div style="font-size:.8rem">'+pl.name+'</div>';
    const p=document.createElement('div');p.className='plate';p.style.width='150px';p.style.height='150px';
    pl.cols.forEach((c,i)=>{const ce=document.createElement('div');ce.className='colony '+c.c;ce.style.left=c.x+'%';ce.style.top=c.y+'%';ce.style.width='20px';ce.style.height='20px';addFastClick(ce,()=>{document.querySelectorAll('.colony').forEach(x=>x.classList.remove('selected'));ce.classList.add('selected');p6col=pl.id+'-'+i;});p.appendChild(ce);});
    pw.appendChild(p);wrap.appendChild(pw);
});
addFastClick('btn-p6-check',()=>p6check());}
function p6check(){
if(p6col==='LBampXI-1'){playSound('complete');launchConfetti();G.scores[5]=50;G.score+=50;document.getElementById('p6fb').innerHTML='<button class="btn primary" id="btn-res">🏆 結果を見る</button>';addFastClick('btn-res',()=>showRes());}
else{playSound('fail');}}
function showRes(){showScreen('results');const total=G.scores.reduce((a,b)=>a+b,0);document.getElementById('resc').innerHTML='<h2>RESULT</h2><div style="font-size:3rem">'+total+'</div><button class="btn" onclick="location.reload()">🔄 TOPへ</button>';}
</script>
</body></html>
